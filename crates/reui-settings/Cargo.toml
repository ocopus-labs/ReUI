[package]
name = "reui-settings"
description = "ReUI's Settings window: every setting in one place, drawn in the island's own design language"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
reui-design.workspace = true
reui-protocol.workspace = true
postcard.workspace = true
# Keys keep their order when a settings file is rewritten.
serde_json = { version = "1.0", features = ["preserve_order"] }
windows-numerics.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
