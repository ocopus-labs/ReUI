[package]
name = "reui-hub"
description = "ReUI hub: owns all module state and serves it to surfaces"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
reui-protocol.workspace = true
# The device drawings' bytes (`reui_design::devices`), shared with Settings' preview.
reui-design.workspace = true
anyhow.workspace = true
# Stable content hash for clipboard dedupe; "pure" avoids the C/asm build.
blake3 = { version = "1.8", features = ["pure"] }
chrono = "0.4.45"
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset"] }
serde.workspace = true
# `preserve_order`: an MCP form's fields are asked in its schema's order.
serde_json = { version = "1.0", features = ["preserve_order"] }
windows-future = "0.3.2"
# `IIterable<HSTRING>` from a Vec (device watcher properties).
windows-collections = "0.3.2"
# `#[implement]`/`#[interface]` expand to `::windows_core` paths (audio callbacks, IPolicyConfig).
windows-core = "0.62.2"
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros", "process", "signal"] }

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # Core Audio (modules/audio.rs)
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_Packaging_Appx",
    # Clipboard window: caret lookup (UI Automation, MSAA), per-monitor DPI, OCR, battery saver
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_System_Power",
    "Graphics_Imaging",
    "Media_Ocr",
    # System OSD: brightness (WMI, DDC/CI, display names), power settings, brightness keys,
    # the Windows build for logs
    "Win32_Devices_Display",
    "Win32_System_Wmi",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_UI_Input",
    # Shared system-events window: session unlocks, device-interface arrivals
    "Win32_System_RemoteDesktop",
    "Win32_System_Ioctl",
    "Win32_Devices_PortableDevices",
    # Devices: Bluetooth watchers and advertisements, PnP properties and eject, controllers,
    # batteries, drives, the eject veto's event
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Enumeration",
    "Devices_Power",
    "Gaming_Input",
    "System_Power",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_IO",
    "Win32_System_EventLog",
    # Timers: the finish sound's fallback beep, "Ends 3:42 PM" in the user's time format
    "Win32_System_Diagnostics_Debug",
    "Win32_Globalization",
    # System stats: CPU and memory, interface counters, PDH (GPU, disk)
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Performance",
    # Notifications (off by default): the listener, a toast's app (AppInfo) and its logo
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
]

# The notification probe (examples/notifications_probe.rs) sends its own test toasts and
# counts CPU cycles.
[dev-dependencies.windows]
workspace = true
features = ["Data_Xml_Dom", "Win32_System_WindowsProgramming"]

[build-dependencies]
reui-design.workspace = true
