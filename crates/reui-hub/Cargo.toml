[package]
name = "reui-hub"
description = "ReUI hub: owns all module state and serves it to surfaces"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
reui-protocol.workspace = true
anyhow.workspace = true
# Stable content hash for clipboard dedupe; "pure" avoids the C/asm build.
blake3 = { version = "1.8", features = ["pure"] }
chrono = "0.4.45"
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset"] }
serde.workspace = true
serde_json = "1.0"
windows-future = "0.3.2"
# `#[implement]`/`#[interface]` expand to `::windows_core` paths (audio callbacks, IPolicyConfig).
windows-core = "0.62.2"
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros", "process", "signal"] }

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # Core Audio (modules/audio.rs)
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_Packaging_Appx",
    # Clipboard window: caret lookup (UI Automation, MSAA), per-monitor DPI, OCR, battery saver
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_System_Power",
    "Graphics_Imaging",
    "Media_Ocr",
]
