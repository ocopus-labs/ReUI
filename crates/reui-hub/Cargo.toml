[package]
name = "reui-hub"
description = "ReUI hub: owns all module state and serves it to surfaces"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
reui-protocol.workspace = true
anyhow.workspace = true
chrono = "0.4.45"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0"
windows-future = "0.3.2"
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros", "process", "signal"] }

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]
