[package]
name = "reui-bridge"
description = "Forwards coding-agent hook events to the ReUI hub, and installs those hooks"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
reui-protocol.workspace = true
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }

# The parent process chain sent with each event (parents.rs).
[dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"]

[build-dependencies]
reui-design.workspace = true
