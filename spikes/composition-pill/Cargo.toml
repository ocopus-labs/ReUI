[package]
name = "composition-pill"
version = "0.1.0"
edition = "2021"
description = "Phase 0a spike: native dynamic-island pill on Windows.UI.Composition"
publish = false

[dependencies]
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Foundation_Numerics",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Graphics",
    "Graphics_DirectX",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
