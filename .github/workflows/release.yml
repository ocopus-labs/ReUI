# Builds ReUI's release assets on a version tag (v0.1.0) or by hand, and attaches them to a
# GitHub release: ReUI-Setup-<version>.exe (single-file per-user installer) and
# ReUI-<version>-x64.zip. Packaging is scripts/package.ps1, so it can be run locally too.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "reui-hub").version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != Cargo version $version" }

      - name: Test
        run: cargo test --workspace

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -OutDir dist

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ReUI-Setup-*.exe
            dist/ReUI-*-x64.zip
          generate_release_notes: true

      - name: Keep the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: reui-${{ github.sha }}
          path: |
            dist/ReUI-Setup-*.exe
            dist/ReUI-*-x64.zip
